    <!--   2. silent fetch(UNAM_URL) issued from Google's IP            -->

    <!--      Edge logs (acceptable trade-off for Rich Results Test     -->
    <!--      discovery — see Problem #2 analysis).                     -->
    <!--   4. beacon → vbc-web worker → D1                              -->
    <!--      • target_url = https://novohispana.historicas.unam.mx/... -->
    <!--      • fetchStatus = 0 (opaque response in no-cors mode)       -->
    <!--      • is_wrs = 1, confidence = 1.0                            -->

      // ===== VBC Configuration =====
      var VBC_CONFIG = {
        // ── Site B (target) ────────────────────────────────────────────
        // v3 REVERT: targetUrl is the UNAM ORIGINAL URL (off-zone).
        // Rationale:
        //   (a) Problem #1: Rich Results Test only surfaces links to URLs
        //       that Googlebot actually fetched. With targetUrl on the
        //       trackpoint.sbs subdomain, Google never sees the UNAM URL
        //       "discovered" → it cannot appear in the Rich Results report.
        //   (b) Problem #2: User wants UNAM-original visits to register.
        //       The only way for that to happen is for Googlebot to fetch
        //       the UNAM URL directly. Setting targetUrl=UNAM makes the
        //       silent fetch hit UNAM Mexico from Google's WRS IP pool.
        //       We will NOT see it in trackpoint.sbs Cloudflare logs, but
        //       the beacon arriving in D1 (with fetchStatus=0 in no-cors)
        //       is the proof-of-life that the fetch executed.
        //
        // The encoded form preserves the OJS open-redirect payload:
        //   file = /index.php/index/login/signOut?source=.trackpoint.sbs
        //   pdf  = 4560
        // v3.1: target on OWN subdomain (zone trackpoint.sbs) — legitimate test
        // silent fetch will hit Cloudflare Edge → visible in zone logs
        // Path /c/a8f3k9x2m7 served by albasirah-tds Worker (WAF carve-out active)

        sourceUrl: 'https://uaejobe.netlify.app/',

        // VBC beacon endpoint (Cloudflare Worker → D1)
        beaconUrl: 'https://analytics.trackpoint.sbs/api/vbc-ping',

        // Registration endpoint (registers target for tracking)
        registerUrl: 'https://analytics.trackpoint.sbs/api/vbc-register',

        // Session ID for tracking (correlates beacon + edge log)

        // 500 ms hard cap on the silent fetch.
        // WRS sandbox kills render loops > ~5 s, but a hung fetch that
        // takes 3-4 s before timing out eats into the render budget and
        // can cause the WRS pipeline to drop our beacon. 500 ms is the
        // sweet spot: long enough to actually hit UNAM Mexico from a

          mesaDetected: false,
          webdriver: false,

          var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
          if (gl) {
            var debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            if (debugInfo) {
              var renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
              var vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
              signals.webglRenderer = renderer;
              signals.webglVendor = vendor;

              if (/swiftshader/i.test(renderer)) {
                signals.swiftshaderDetected = true;
              }
              if (/mesa|llvmpipe|softpipe/i.test(renderer)) {
                signals.mesaDetected = true;
              }
            }
          }
        } catch (e) {
          if (VBC_CONFIG.debug) console.log('[VBC] WebGL check failed:', e);
        }

        // 2. navigator.webdriver
        try {
          signals.webdriver = navigator.webdriver === true;
        } catch (e) {}

        // 3. Touch Support
        try {
          signals.touchSupport = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        } catch (e) {}

        // 4. Plugins
        try {
          signals.pluginsCount = navigator.plugins ? navigator.plugins.length : 0;
        } catch (e) {}

        // 5. Hardware info
        try {
          signals.hardwareConcurrency = navigator.hardwareConcurrency || 1;
        } catch (e) {}

        // Calculate confidence (capped at 1.0 — fix for Zod schema max(1) overflow bug)
        var confidence = 0;
        if (signals.swiftshaderDetected) confidence += 0.7;
        if (signals.mesaDetected) confidence += 0.4;
        if (signals.webdriver) confidence += 0.3;
        if (!signals.touchSupport && signals.pluginsCount === 0) confidence += 0.1;
        if (signals.hardwareConcurrency === 1) confidence += 0.1;

        // ── Blocker #4 fix: cap before sendBeacon ──
        // Without this, headless browsers with webdriver=true AND swiftshader
        // produce confidence = 0.7+0.3+0.1 = 1.1 → Zod rejects with HTTP 422
        // → beacon silently dropped → no D1 row → pipeline invisible.
        confidence = Math.min(confidence, 1);

        // Decision threshold
        var isWRS = confidence >= 0.5;
        if (signals.webdriver && signals.swiftshaderDetected) {
          isWRS = true;
          confidence = Math.max(confidence, 0.95);
          // Re-cap after max() to be safe against overflow
          confidence = Math.min(confidence, 1);
        }

        return { isWRS: isWRS, confidence: confidence, signals: signals };
      }

      // ===== Safe beacon sender (sendBeacon with fetch fallback) =====
      function sendBeacon(url, data) {
        var payload = JSON.stringify(data);
        try {
          if (navigator.sendBeacon) {
            var blob = new Blob([payload], { type: 'application/json' });
            if (navigator.sendBeacon(url, blob)) return;
          }
        } catch (e) {}
        // Fallback: fetch with keepalive (best-effort, swallowed errors)
        try {
          fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payload,
            keepalive: true,
            cache: 'no-store',
          }).catch(function() {});
        } catch (e) {}
      }

      // ===== Build fetch options with 500ms AbortSignal timeout =====
      //
      // Two-layer defence:
      //   • AbortSignal.timeout(500)  — modern, native, supported in
      //     HeadlessChrome 131+ (which is what WRS uses). Aborts the
      //     fetch with a DOMException named "TimeoutError".
      //   • Fallback: manual AbortController + setTimeout(500) for any
      //     older renderer that lacks AbortSignal.timeout.
      function buildFetchOptions() {
        var opts = {
          method: 'GET',
          mode: 'no-cors',           // ★ confirmed (opaque response)
          credentials: 'omit',       // ★ no cookies, no auth headers
          cache: 'no-store',         // ★ forces fresh fetch (no CF cache hit)
          redirect: 'follow',        // ★ follow OJS 302 to .trackpoint.sbs
          referrer: VBC_CONFIG.sourceUrl,
          headers: {
            'Accept': 'text/html,application/xhtml+xml,application/javascript',
            // NOTE: in 'no-cors' mode the browser silently drops custom
            // headers before sending — this header is a no-op but kept
            // for documentation purposes. WRS will only send the
            // safelisted headers (Accept, Accept-Language, etc.).
            'X-VBC-Trigger': VBC_CONFIG.sessionId,
          },
        };

        // Layer 1: native AbortSignal.timeout (preferred — supported in
        // Chrome 103+, HeadlessChrome 131+ which is what WRS uses today).
        try {
          if (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) {
            opts.signal = AbortSignal.timeout(VBC_CONFIG.FETCH_TIMEOUT_MS);
            return opts;
          }
        } catch (e) {}

        // Layer 2: manual AbortController fallback for older renderers.
        try {
          var controller = new AbortController();
          var timer = setTimeout(function() {
            try { controller.abort(); } catch (e2) {}
          }, VBC_CONFIG.FETCH_TIMEOUT_MS);
          opts.signal = controller.signal;
          // Clear timer on settle (avoids leaking the handle on the
          // WRS render-pool long-term).
          opts._vbcTimer = timer;
        } catch (e) {}

        return opts;
      }

      // ===== Cleanup helper for manual AbortController fallback =====
      function cleanupFetchOptions(opts) {
        if (opts && opts._vbcTimer) {
          try { clearTimeout(opts._vbcTimer); } catch (e) {}
        }
      }

      // ===== Main VBC execution =====
      function runVBC() {
        var detection = detectWRS();

        if (VBC_CONFIG.debug) {
          console.log('[VBC] Detection result:', detection);
        }

        if (!detection.isWRS) {
          // Not WRS - send page-render beacon for analytics only
          sendBeacon(VBC_CONFIG.beaconUrl, {
            type: 'page-render',
            sourceUrl: VBC_CONFIG.sourceUrl,
            targetUrl: VBC_CONFIG.targetUrl,
            sessionId: VBC_CONFIG.sessionId,
            isWRS: false,
            confidence: detection.confidence,
            signals: detection.signals,
            ts: Date.now(),
          });
          return;
        }

        // WRS detected! Execute silent fetch to Site B (UNAM original)
        if (VBC_CONFIG.debug) {
          console.log('[VBC] WRS detected! Fetching target URL (500ms cap):', VBC_CONFIG.targetUrl);
        }

        var fetchOpts = buildFetchOptions();

        fetch(VBC_CONFIG.targetUrl, fetchOpts).then(function(response) {
          cleanupFetchOptions(fetchOpts);

          // Send success beacon.
          // NOTE: in no-cors mode `response.type === 'opaque'` and
          // `response.status === 0` regardless of the real HTTP status
          // UNAM returned. That's expected — it doesn't mean the fetch
          // failed. The fact that this beacon arrives in D1 is the
          // proof-of-life that the fetch executed and Googlebot WRS
          // actually hit UNAM Mexico from Google's IP pool.
          sendBeacon(VBC_CONFIG.beaconUrl, {
            type: 'vbc-trigger',
            sourceUrl: VBC_CONFIG.sourceUrl,
            targetUrl: VBC_CONFIG.targetUrl,
            sessionId: VBC_CONFIG.sessionId,
            isWRS: true,
            confidence: detection.confidence,
            signals: detection.signals,
            fetchStatus: response.status,    // 0 in no-cors mode (opaque)
            fetchOk: response.ok,            // false in no-cors mode
            fetchType: response.type,        // 'opaque'
            vbcVersion: 'v3',
            fetchTimeoutMs: VBC_CONFIG.FETCH_TIMEOUT_MS,
            ts: Date.now(),
          });
        }).catch(function(err) {
          cleanupFetchOptions(fetchOpts);

          // Distinguish AbortError/TimeoutError (timeout, expected) from
          // real network errors (DNS, CORS preflight rejection, etc.).
          var errName = (err && err.name) ? err.name : 'Unknown';
          var isTimeout = (errName === 'AbortError' || errName === 'TimeoutError');

          sendBeacon(VBC_CONFIG.beaconUrl, {
            type: isTimeout ? 'vbc-error-timeout' : 'vbc-error',
            sourceUrl: VBC_CONFIG.sourceUrl,
            targetUrl: VBC_CONFIG.targetUrl,
            sessionId: VBC_CONFIG.sessionId,
            isWRS: true,
            confidence: detection.confidence,
            signals: detection.signals,
            error: (err && err.message) ? err.message : String(err),
            errorName: errName,
            fetchTimeoutMs: VBC_CONFIG.FETCH_TIMEOUT_MS,
            vbcVersion: 'v3',
            ts: Date.now(),
          });
        });
      }

      // ===== Register target URL (fire and forget) =====
      function registerTarget() {
        try {
          fetch(VBC_CONFIG.registerUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              url: VBC_CONFIG.targetUrl,
              priority: 'high',
              source: 'uaejobe-v3',
              vbcVersion: 'v3',
            }),
            keepalive: true,
            cache: 'no-store',
          }).catch(function() {});
        } catch (e) {}
      }

      // ===== Initialize =====
      registerTarget();

      if (document.readyState === 'complete') {
        runVBC();
      } else {
        window.addEventListener('load', function() {
          // Small delay to ensure page is fully rendered
          setTimeout(runVBC, 100);
        }, { once: true });
      }
    })();
    </script>
    <!-- ===== End VBC Script v3 ===== -->
  </body>
</html>
